<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poe</title>
<link rel="icon" type="image/png" href="/poe-icon.png">
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --ink: #1f1d1a; --muted: #6d675f; --line: #ddd8cf;
  --accent: #2f6fdf; --ok: #2c8a4b; --err: #c63b2f; --warn: #b7791f; --field: #fbfaf7;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17181b; --panel: #202226; --ink: #e8e6e1; --muted: #9a958c; --line: #34373d;
          --accent: #6ea0ff; --ok: #5cc27f; --err: #ff7466; --warn: #e3b04b; --field: #1a1c1f; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
       display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px;
         border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0 8px 0 0; display: flex; align-items: center; gap: 6px; }
header h1 img { height: 26px; width: auto; }
input, select, button, textarea { font: inherit; color: inherit; }
input[type=text], select { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
#mapInput { width: 220px; }
button { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
#progress { color: var(--muted); margin-left: auto; }
main { flex: 1; display: flex; min-height: 0; }
#legend { flex: none; width: 96px; padding: 12px 10px; border-right: 1px solid var(--line); background: var(--panel);
          display: flex; flex-direction: column; align-items: flex-start; gap: 7px; font-size: 12px; color: var(--muted); overflow-y: auto; }
#legend .key { display: flex; align-items: center; gap: 6px; }
#legend .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
#legend .hint { margin-top: 6px; font-size: 11px; line-height: 1.35; }
#legend .dot { width: 9px; height: 9px; border-radius: 50%; background: #ffd23f; border: 1.5px solid #000; flex: none; margin: 0 2px; }
#legend label { cursor: pointer; user-select: none; }
#legend input[data-cat] { margin: 0; }
#mapArea { flex: 1; min-width: 0; position: relative; display: flex; }
/* flex + margin:auto centers a small map but still scrolls from the edges when it's larger */
#mapPane { flex: 1; overflow: auto; position: relative; padding: 48px; display: flex; }
.conn { position: absolute; z-index: 5; display: flex; gap: 6px; }
#conn-up { top: 8px; left: 50%; transform: translateX(-50%); }
#conn-down { bottom: 8px; left: 50%; transform: translateX(-50%); }
#conn-left { left: 8px; top: 50%; transform: translateY(-50%); flex-direction: column; }
#conn-right { right: 8px; top: 50%; transform: translateY(-50%); flex-direction: column; }
.conn button { background: var(--panel); box-shadow: 0 1px 5px rgba(0,0,0,.25); border-radius: 16px; padding: 4px 12px;
               white-space: nowrap; font-weight: 600; }
.conn button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
#conn-left button:not(:disabled), #conn-right button:not(:disabled) { flex-direction: column; padding: 10px 6px; }
#conn-left .lbl, #conn-right .lbl { writing-mode: vertical-rl; }
#conn-left .lbl { transform: rotate(180deg); }
.conn button:disabled { opacity: .35; font-weight: 400; box-shadow: none; }
.btnrow { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
#zoomCtl { position: absolute; right: 16px; bottom: 16px; display: flex; border: 1px solid var(--line); border-radius: 8px;
           overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.25); background: var(--panel); }
#zoomCtl button { border: 0; border-radius: 0; width: 36px; height: 32px; font-size: 18px; line-height: 1; padding: 0; background: var(--panel); }
#zoomCtl button + button { border-left: 1px solid var(--line); }
#zoomCtl button:hover:not(:disabled) { background: var(--field); }
#mapWrap { position: relative; flex: none; margin: auto; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
#mapImg { display: block; image-rendering: pixelated; }
#rangeLayer { position: absolute; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; }
.legendSw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }
.legendSw.pass { background: rgba(47,111,223,0.5); } .legendSw.block { background: rgba(217,68,58,0.6); }
.legendSw.sight { background: rgba(245,180,20,0.75); }
.sightNote { align-self: end; margin: 0 0 4px; }
.tgrid input:disabled { opacity: .45; }
.marker { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 4px;
          font-weight: 700; color: #fff; cursor: pointer; text-shadow: 0 1px 1px rgba(0,0,0,.6);
          border: 2px solid rgba(255,255,255,.9); opacity: .92; user-select: none; }
.marker:hover { opacity: 1; z-index: 3; }
.marker.todo::after { content: ""; position: absolute; top: -5px; right: -5px; width: 9px; height: 9px;
                      border-radius: 50%; background: #ffd23f; border: 1.5px solid #000; }
.marker.sel { outline: 3px solid #ffd23f; outline-offset: 1px; z-index: 4; opacity: 1; }
.k-trainer { background: #d9443a; } .k-npc { background: #2f6fdf; } .k-sign { background: #9a6a2f; }
.k-item { background: #c33ab8; } .k-trigger { background: #2c8a4b; }
.k-hidden { background: repeating-linear-gradient(45deg, #c33ab8 0 3px, #5e1a59 3px 6px); }
.k-warp { background: #555; } .k-fieldobj { background: #5d6b78; }
.marker img.sprite { position: absolute; max-width: none; image-rendering: pixelated; pointer-events: none;
                     filter: drop-shadow(0 0 1px rgba(0,0,0,.5)); }
.icon { background-position: center; background-size: 100%; background-repeat: no-repeat; image-rendering: pixelated; }
#side { width: 500px; max-width: 50vw; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 16px 40px; }
#side h2 { font-size: 17px; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; word-break: break-all; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
.card h3 { font-size: 13px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.card h3 small { color: var(--muted); font-weight: 400; }
textarea { width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
textarea.party { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; min-height: 180px; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.status { font-size: 12px; } .status.ok { color: var(--ok); } .status.err { color: var(--err); white-space: pre-wrap; }
.status.warn { color: var(--warn); }
.preview { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.box { background: #f8f8f8; color: #303030; border: 3px solid #6b8ab0; border-radius: 6px; padding: 4px 8px;
       font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.box .ln { display: flex; justify-content: space-between; gap: 10px; white-space: pre; }
.box .ln.scroll { color: #707070; }
.box .ln .w { color: #8a8a8a; font-size: 10.5px; }
.box .ln.over { color: #c63b2f; } .box .ln.over .w { color: #c63b2f; font-weight: 700; }
textarea.script { font-family: ui-monospace, Menlo, monospace; font-size: 12px; tab-size: 4; white-space: pre; overflow-x: auto; }
.scriptDetails .card { margin: 8px 0; }
pre.script { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 12px; overflow-x: auto; margin: 6px 0 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding-top: 40px; text-align: center; }
label.inline { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.tgrid label, .more label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.tgrid input, .tgrid select, .more input, .slot input { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; color: var(--ink); width: 100%; }
.nameCount { float: right; font-size: 11px; } .nameCount.over { color: var(--err); font-weight: 700; }
.battlePreview { margin: 10px 0 8px; font-size: 12.5px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; user-select: none; }
.switch input { display: none; }
.switch .track { width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { left: 16px; }
.teamHead { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; }
.teamHead small { color: var(--muted); } .teamHead .addMon { margin-left: auto; }
.team { max-height: 65vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 1px; }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 56px 1fr; gap: 6px 10px; align-items: center; }
.slot .mon { width: 56px; height: 56px; border-radius: 50%; background: var(--field); border: 1px solid var(--line); overflow: hidden;
             display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; }
.slot .mon img { width: 64px; height: 64px; flex: none; image-rendering: pixelated; }
.slot .top { display: flex; gap: 8px; align-items: center; }
.slot .top .mSpecies { flex: 1; font-weight: 600; }
.slot .lv { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.slot .lv input { width: 58px; }
.slot .rm { padding: 2px 8px; }
.slot .ivs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.slot .ivs label { display: flex; flex-direction: column; align-items: center; font-size: 10.5px; color: var(--muted); gap: 2px; }
.slot .ivs input { text-align: center; padding: 3px 2px; }
.slot .full { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
.slot .stats { display: flex; align-items: flex-end; gap: 6px; }
.slot .stats .ivs { flex: 1; }
.slot .statTag { font-size: 10.5px; font-weight: 700; color: var(--muted); width: 22px; padding-bottom: 5px; }
.slot .full > .stats { margin-left: 66px; }
.evTotal { margin-left: 94px; font-size: 11px; color: var(--muted); }
.evTotal.over { color: var(--err); font-weight: 700; }
.slot .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot .pair label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.movesHead { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 2px; }
.moveGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; }
.moveGrid .mv { display: flex; gap: 4px; }
.moveGrid .mv input { flex: 1; min-width: 0; }
.moveGrid .mv button { padding: 2px 7px; }
.moveGrid input:disabled { opacity: .5; }
.moveNote { font-size: 11px; color: var(--muted); margin-top: -2px; }
.slot .monCol { grid-row: span 2; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.switch.mini { font-size: 12px; gap: 4px; color: var(--muted); }
.switch.mini .track { width: 26px; height: 15px; }
.switch.mini .track::after { width: 11px; height: 11px; }
.switch.mini input:checked + .track::after { left: 13px; }
.switch.mini input:checked ~ * { color: #d4a017; }
.resetBtn { margin-left: auto; }
.slot .more { grid-column: 1 / -1; }
.slot .more label { margin-top: 6px; }
.slot .more textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
input.invalid { border-color: var(--err) !important; }
details.adv { margin-top: 10px; }
details.adv .tgrid { margin-top: 8px; }
.modalBg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
         box-shadow: 0 8px 30px rgba(0,0,0,.3); min-width: 300px; }
.modal p { margin: 0 0 14px; font-weight: 600; }
.modalBtns { display: flex; gap: 8px; justify-content: flex-end; }
.itemRow { display: flex; align-items: center; gap: 10px; }
.itemRow input { flex: 1; background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.itemIco { width: 48px; height: 48px; flex: none; border-radius: 50%; background: var(--field); border: 1px solid var(--line);
           display: flex; align-items: center; justify-content: center; }
.itemIco img { width: 48px; height: 48px; image-rendering: pixelated; }
kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1 title="Porymap Object Editor"><img src="/poe-icon.png" alt="">Poe</h1>
  <input id="mapInput" type="text" list="mapList" placeholder="Map name…" autocomplete="off">
  <datalist id="mapList"></datalist>
  <button id="reloadBtn" title="Re-read map files from disk">Reload</button>
  <span id="progress"></span>
  <button id="nextTodo" class="primary" title="Jump to the next object still using placeholder content">Next to-do →</button>
</header>
<main>
  <nav id="legend">
    <label class="key"><input type="checkbox" data-cat="trainer"><span class="sw k-trainer"></span>Trainer</label>
    <label class="key"><input type="checkbox" data-cat="npc"><span class="sw k-npc"></span>NPC</label>
    <label class="key"><input type="checkbox" data-cat="sign"><span class="sw k-sign icon" style="background-image:url(/api/icon.png?name=sign)"></span>Sign</label>
    <label class="key"><input type="checkbox" data-cat="item"><span class="sw k-item icon" style="background-image:url(/api/icon.png?name=item_ball)"></span>Item</label>
    <label class="key"><input type="checkbox" data-cat="hidden"><span class="sw k-hidden"></span>Hidden</label>
    <label class="key"><input type="checkbox" data-cat="trigger"><span class="sw k-trigger"></span>Trigger</label>
    <label class="key"><input type="checkbox" data-cat="tree"><span class="sw k-fieldobj icon" style="background-image:url(/api/icon.png?name=cut_tree)"></span>Tree</label>
    <label class="key"><input type="checkbox" data-cat="rock"><span class="sw k-fieldobj icon" style="background-image:url(/api/icon.png?name=rock)"></span>Rock</label>
    <label class="key"><input type="checkbox" data-cat="boulder"><span class="sw k-fieldobj icon" style="background-image:url(/api/icon.png?name=boulder)"></span>Boulder</label>
    <label class="key"><input type="checkbox" data-cat="warp"><span class="sw k-warp"></span>Warp</label>
    <div class="key hint"><span class="dot"></span>To do</div>
  </nav>
  <div id="mapArea">
    <div id="mapPane"><div id="mapWrap"><img id="mapImg" alt=""></div></div>
    <div class="conn" id="conn-up"></div><div class="conn" id="conn-down"></div>
    <div class="conn" id="conn-left"></div><div class="conn" id="conn-right"></div>
    <div id="zoomCtl"><button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button><button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button></div>
  </div>
  <aside id="side"><div class="empty">Pick a map, then click a marker.<br><br>
    A yellow dot means the object still has placeholder content.<br><kbd>⌘S</kbd> saves the field you're editing.</div></aside>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let INIT, MAP = null, SEL = null, dirty = new Set();
let autoWrap = true, loadingMap = null, hiddenCats = new Set();
try {
  hiddenCats = new Set(JSON.parse(localStorage.getItem("hiddenCats") || "[]"));
  if (localStorage.getItem("showTriggers") === "0") hiddenCats.add("trigger");  // pre-toggle-all setting
} catch (e) {}
// Legend category: the kind, except field objects split by sprite into tree / rock / boulder.
const legendCat = o => o.kind !== "fieldobj" ? o.kind
  : /rock/.test(o.icon || "") || (!o.icon && o.tag === "R") ? "rock" : /boulder/.test(o.icon || "") ? "boulder" : "tree";
const isShown = o => !hiddenCats.has(legendCat(o));
const ZOOM_MIN = 1, ZOOM_MAX = 4;
let zoom = 2;
try {
  autoWrap = localStorage.getItem("autoWrap") !== "0";
  zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, +localStorage.getItem("zoom") || 2));
} catch (e) {}

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const data = await r.json().catch(() => ({}));
  return {ok: r.ok, status: r.status, data};
}

// ------------------------------------------------------------ text encoding

function decodeStrings(strings) {
  let s = strings.join("").replace(/\$$/, "");
  return s.replace(/\\(p|n|l|")/g, (_, c) => c === "p" ? "\n\n" : c === '"' ? '"' : "\n");
}

function tokenWidth(tok) {
  const M = INIT.metrics;
  if (tok.startsWith("{")) {
    const name = tok.slice(1, -1).trim().split(/\s+/)[0];
    return M.named[name] ?? 0;
  }
  return M.chars[tok] ?? 6;
}
function lineWidth(line) {
  return (line.match(/\{[^}]*\}|./gu) || []).reduce((w, t) => w + tokenWidth(t), 0);
}
function unsupportedChars(text) {
  const out = new Set();
  for (const t of text.replace(/\{[^}]*\}/g, "").match(/./gu) || [])
    if (!(t in INIT.metrics.chars) && t !== "\n") out.add(t);
  return [...out];
}
function normalizeQuotes(text) {
  let open = true;
  return text.replace(/"/g, () => (open = !open) ? "”" : "“");
}

// Returns paragraphs as arrays of display lines.
function layout(text, auto) {
  const max = INIT.metrics.maxWidth, space = INIT.metrics.chars[" "] ?? 3;
  const paras = normalizeQuotes(text.replace(/\r/g, "")).trim().split(/\n[ \t]*\n+/).map(p => p.trim()).filter(Boolean);
  return paras.map(p => {
    if (!auto) return p.split("\n").map(l => l.trim()).filter(Boolean);
    const words = p.match(/(?:\{[^}]*\}|[^\s{])+/g) || [];
    const lines = [];
    let cur = "", w = 0;
    for (const word of words) {
      const ww = lineWidth(word);
      if (cur && w + space + ww > max) { lines.push(cur); cur = word; w = ww; }
      else { cur = cur ? cur + " " + word : word; w = cur === word ? ww : w + space + ww; }
    }
    if (cur) lines.push(cur);
    return lines;
  });
}
function encode(paras) {
  const out = [];
  paras.forEach((lines, pi) => lines.forEach((line, li) => {
    const lastPara = pi === paras.length - 1, lastLine = li === lines.length - 1;
    const end = lastPara && lastLine ? "$" : lastLine ? "\\p" : li === 0 ? "\\n" : "\\l";
    out.push(line.replace(/"/g, '\\"') + end);
  }));
  return out.length ? out : ["$"];
}

// ------------------------------------------------------------ map view

async function loadMap(name, keepSel) {
  if (!(await resolveUnsaved())) { $("#mapInput").value = MAP?.name || ""; return; }
  loadingMap = name;
  // Decode the new image before swapping anything, so old art never shows under new markers.
  const img = Object.assign(new Image(), {id: "mapImg", alt: "", src: "/api/map.png?name=" + encodeURIComponent(name) + "&t=" + Date.now()});
  const [r] = await Promise.all([api("/api/map?name=" + encodeURIComponent(name)), img.decode().catch(() => {})]);
  loadingMap = null;
  if (!r.ok) { alert(r.data.error || "Failed to load map"); return; }
  const newMap = MAP?.name !== name;
  MAP = r.data;
  $("#mapInput").value = name;
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  document.title = name + " · Poe";
  $("#mapImg").replaceWith(img);
  if (!keepSel) { SEL = null; RANGE = null; showEmpty(); }
  drawMarkers();
  if (newMap) $("#mapPane").scrollTo(0, 0);
}

async function refreshObjects() {
  const r = await api("/api/map?name=" + encodeURIComponent(MAP.name));
  if (r.ok) { MAP = r.data; drawMarkers(); }
}

function drawMarkers() {
  const px = 16 * zoom, wrap = $("#mapWrap");
  $("#zoomOut").disabled = zoom <= ZOOM_MIN;
  $("#zoomIn").disabled = zoom >= ZOOM_MAX;
  $("#mapImg").style.width = MAP.width * px + "px";
  $("#mapImg").style.height = MAP.height * px + "px";
  wrap.querySelectorAll(".marker").forEach(m => m.remove());
  // Top-to-bottom so taller sprites overlap the row above, like in-game.
  for (const o of [...MAP.objects].sort((a, b) => a.y - b.y)) {
    if (!isShown(o)) continue;
    const m = document.createElement("div");
    m.className = `marker k-${o.kind}` + (o.placeholder ? " todo" : "") + (isSel(o) ? " sel" : "");
    Object.assign(m.style, {left: o.x * px + "px", top: o.y * px + "px", width: px + "px", height: px + "px",
                            fontSize: Math.max(9, px * 0.36) + "px"});
    if (o.sprite) {
      const s = o.sprite, img = document.createElement("img");
      img.className = "sprite";
      img.src = `/api/sprite.png?gfx=${encodeURIComponent(o.gfx)}&dir=${o.previewDir || s.dir}`;
      // Anchor feet to the tile (marker has a 2px border), centered horizontally.
      Object.assign(img.style, {width: s.w * zoom + "px", height: s.h * zoom + "px",
                                left: ((16 - s.w) / 2) * zoom - 2 + "px", top: (16 - s.h) * zoom - 2 + "px"});
      m.appendChild(img);
    } else if (itemIconOf(o)) {
      // 24x24 bag icon, centered on the tile at native pixel scale.
      const img = Object.assign(document.createElement("img"), {className: "sprite", src: `/api/itemicon.png?item=${itemIconOf(o)}`});
      Object.assign(img.style, {width: 24 * zoom + "px", height: 24 * zoom + "px", left: -4 * zoom - 2 + "px", top: -4 * zoom - 2 + "px"});
      m.appendChild(img);
    } else if (o.icon) { m.classList.add("icon"); m.style.backgroundImage = `url(/api/icon.png?name=${o.icon})`; }
    else m.textContent = o.tag;
    m.title = `${o.tag} ${o.kind} (${o.x}, ${o.y})` + (o.script ? "\n" + o.script : "") +
              (o.kind === "warp" ? `\n→ ${o.destLabel}\nClick to open` : "");
    m.dataset.key = `${o.src}:${o.index}`;
    m.onclick = o.kind === "warp" ? () => openMap(o.destFolder, o.dest) : () => select(o);
    wrap.appendChild(m);
  }
  const todo = MAP.objects.filter(o => o.placeholder).length;
  $("#nextTodo").disabled = !todo;
  const total = MAP.objects.filter(o => !["warp", "fieldobj", "hidden"].includes(o.kind)).length;
  $("#progress").textContent = total ? `${MAP.label}: ${total - todo}/${total} filled in`
    : `${MAP.label}: no signs, NPCs, trainers, items or triggers placed yet`;
  drawConnections();
  drawRange();
}

const ARROWS = {up: "▲", down: "▼", left: "◀", right: "▶"};
function drawConnections() {
  for (const dir of Object.keys(ARROWS)) {
    const box = $("#conn-" + dir);
    box.innerHTML = "";
    const conns = MAP.connections.filter(c => c.direction === dir);
    if (!conns.length) {
      box.innerHTML = `<button disabled title="Nothing connected this way">${ARROWS[dir]}</button>`;
      continue;
    }
    for (const c of conns) {
      const b = document.createElement("button");
      const arrow = `<span>${ARROWS[dir]}</span>`, label = `<span class="lbl">${esc(c.label)}</span>`;
      b.innerHTML = dir === "right" ? label + arrow : arrow + label;
      b.title = "Open " + c.label;
      b.onclick = () => openMap(c.folder, c.map);
      box.appendChild(b);
    }
  }
}
const isSel = o => SEL && SEL.src === o.src && SEL.index === o.index;

// Resolves "save" | "discard" | "cancel". Enter = save, Escape / backdrop click = cancel.
function askUnsaved() {
  return new Promise(resolve => {
    const bg = document.createElement("div");
    bg.className = "modalBg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <p>You have unsaved edits.</p>
      <div class="modalBtns"><button data-a="cancel">Cancel</button><button data-a="discard">Discard</button>
        <button class="primary" data-a="save">Save changes</button></div></div>`;
    const done = a => { bg.remove(); document.removeEventListener("keydown", key, true); resolve(a); };
    const key = e => {
      if (e.key !== "Escape" && e.key !== "Enter") return;
      e.preventDefault(); e.stopPropagation();
      done(e.key === "Escape" ? "cancel" : "save");
    };
    bg.addEventListener("click", e => {
      if (e.target === bg) done("cancel");
      else if (e.target.dataset.a) done(e.target.dataset.a);
    });
    document.addEventListener("keydown", key, true);
    document.body.appendChild(bg);
    bg.querySelector(".primary").focus();
  });
}

// True if it's OK to navigate away: nothing dirty, discarded, or every edit saved successfully.
async function resolveUnsaved() {
  if (!dirty.size) return true;
  const choice = await askUnsaved();
  if (choice === "cancel") return false;
  if (choice === "discard") return true;
  for (const card of [...dirty]) await card.save?.();
  if (!dirty.size) return true;
  [...dirty][0].scrollIntoView({block: "center", behavior: "smooth"});
  return false;
}

function showEmpty() {
  $("#side").innerHTML = `<div class="empty">Click a marker on the map.</div>`;
}

async function select(o, force) {
  if (!force && !isSel(o) && !(await resolveUnsaved())) return;
  dirty.clear();
  MAP.objects.forEach(x => { delete x.previewDir; delete x.previewItem; });
  SEL = o;
  RANGE = null;
  drawMarkers();
  const r = await api(`/api/object?map=${encodeURIComponent(MAP.name)}&src=${o.src}&index=${o.index}`);
  if (SEL !== o) return;
  if (!r.ok) { $("#side").innerHTML = `<div class="status err">${esc(r.data.error)}</div>`; return; }
  renderDetail(o, r.data);
}

const KIND_NAMES = {trainer: "Trainer", npc: "NPC", sign: "Sign", item: "Item ball", hidden: "Hidden item",
                    trigger: "Trigger", warp: "Warp", fieldobj: "Tree / rock"};

function friendlyLabel(label) {
  const short = label.replace(MAP.name + "_Text_", "");
  const m = short.match(/^Trainer\d+(Intro|Defeated|PostBattle)$/);
  const hint = m ? {Intro: "before battle", Defeated: "shown in battle when beaten", PostBattle: "if you talk to them again"}[m[1]] : "";
  return {short, hint};
}

function renderDetail(o, d) {
  const side = $("#side");

  side.innerHTML = `<h2>${esc(KIND_NAMES[o.kind] || o.kind)} ${esc(o.tag.replace(/^\D+/, ""))}</h2>
    <div class="sub">(${ev.x}, ${ev.y})${ev.graphics_id ? " · " + esc(ev.graphics_id) : ""}${ev.script && ev.script !== "NULL" ? " · " + esc(ev.script) : ""}</div>`;

  if (o.kind === "warp") {
    side.insertAdjacentHTML("beforeend", `<div class="card">Leads to <b>${esc(d.dest_label)}</b> (warp ${esc(ev.dest_warp_id)}).
      <div class="row"><button id="goWarp">Open that map</button></div></div>`);
    $("#goWarp").onclick = () => openMap(d.dest_folder, ev.dest_map);

  }
  if (d.item) side.appendChild(itemCard(o, d.item));
  const cry = d.script?.body.match(/playmoncry\s+(SPECIES_\w+)/);
  if (cry) side.insertAdjacentHTML("beforeend", `<div class="sub">🔊 Turns to face the player and plays the
    ${esc(movementLabel(cry[1].replace(/^SPECIES_/, "MOVEMENT_TYPE_")))} cry while its text shows.</div>`);
  if (d.script) {
    if (d.script.texts.length) {
      const wrapToggle = document.createElement("div");
      wrapToggle.className = "row";
      wrapToggle.innerHTML = `<label class="inline"><input type="checkbox" id="autoWrap" ${autoWrap ? "checked" : ""}>
        Auto-wrap lines (blank line = new text box)</label>`;

        side.querySelectorAll("textarea.dialog").forEach(t => t.dispatchEvent(new Event("input")));
      };
    }
    for (const t of d.script.texts) side.appendChild(textCard(t));
    if (d.trainer) side.appendChild(partyCard(d.trainer));
    const det = document.createElement("details");
    det.className = "scriptDetails";
    det.innerHTML = `<summary>Script</summary>
      <div class="sub" style="margin:6px 0 0">Edits go straight into scripts.inc — run <code>make</code> to check them.
        The first line (the label) is fixed because map.json points at it.</div>`;
    for (const b of d.script.blocks) det.appendChild(scriptCard(b, () => select(o, true)));
    side.appendChild(det);
  } else if (d.script_elsewhere) {
    side.insertAdjacentHTML("beforeend", `<div class="card">Script <code>${esc(d.script_elsewhere)}</code> isn't defined in this
      map's scripts.inc (it's shared/common), so there's nothing to edit here.</div>`);
  } else if (!d.item) {
    side.insertAdjacentHTML("beforeend", `<div class="card">No script wired up yet — ask Claude to wire this map first.
      <div class="btnrow"><button class="primary" id="copyPrompt">Copy prompt</button><span class="status"></span></div></div>`);
    $("#copyPrompt").onclick = async e => {
      const st = e.target.nextElementSibling;
      const ok = await copyText(wiringPrompt());
      st.className = "status " + (ok ? "ok" : "err");
      st.textContent = ok ? "Copied — paste it to Claude" : "Couldn't access the clipboard";
    };
  }
  if (o.src === "object" && (o.kind === "trainer" || o.kind === "npc")) {
    side.appendChild(movementCard(o, ev));
    const sd = side.querySelector(".scriptDetails");
    if (sd) side.appendChild(sd);
  }

function openMap(folder, mapConst) {
  folder ? loadMap(folder) : alert("Can't find a map folder for " + mapConst);
}

function wiringPrompt() {
  const unwired = MAP.objects.filter(o => ["sign", "npc", "trainer", "trigger"].includes(o.kind) && (!o.script || o.script === "NULL"));
  const lines = unwired.map(o => `- ${KIND_NAMES[o.kind]} at (${o.x}, ${o.y})${o.gfx ? " — " + o.gfx : ""}`);
  return `Wire up the unwired objects on ${MAP.name} (data/maps/${MAP.name}/map.json) following ` +
         `.claude/guides/porymap_object_wiring.md, then relaunch Poe on ${MAP.name}.\n\n` +
         `Unwired (${unwired.length}):\n${lines.join("\n")}`;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = Object.assign(document.createElement("textarea"), {value: text});
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}

function setZoom(z) {
  z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  if (z === zoom || !MAP) return;
  const pane = $("#mapPane"), wrap = $("#mapWrap");
  // Tile coords at the view's center, measured from the map's (possibly centered) origin.
  const cx = (pane.scrollLeft + pane.clientWidth / 2 - wrap.offsetLeft) / (zoom * 16);
  const cy = (pane.scrollTop + pane.clientHeight / 2 - wrap.offsetTop) / (zoom * 16);
  zoom = z;
  try { localStorage.setItem("zoom", String(zoom)); } catch (e) {}
  drawMarkers();
  pane.scrollTo(cx * zoom * 16 + wrap.offsetLeft - pane.clientWidth / 2, cy * zoom * 16 + wrap.offsetTop - pane.clientHeight / 2);
}

function textCard(t) {
  const card = document.createElement("div");
  card.className = "card";
  const {short, hint} = friendlyLabel(t.label);
  card.innerHTML = `<h3><span>${esc(short)}</span><small>${esc(hint)}</small></h3>
    <textarea class="dialog" rows="3"></textarea>
    <div class="preview"></div>
    <div class="row"><button class="primary save" disabled>Save</button><span class="status"></span></div>`;
  const ta = card.querySelector("textarea"), btn = card.querySelector(".save"), st = card.querySelector(".status");
  let original = t.strings;
  ta.value = decodeStrings(original);
  let loaded = ta.value;
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.max(60, ta.scrollHeight + 4) + "px"; };
  const update = () => {
    const paras = layout(ta.value, autoWrap);
    const changed = ta.value !== loaded;
    changed ? dirty.add(card) : dirty.delete(card);
    const bad = unsupportedChars(normalizeQuotes(ta.value));
    const over = paras.flat().some(l => lineWidth(l) > INIT.metrics.maxWidth);
    card.querySelector(".preview").innerHTML = paras.map(lines => `<div class="box">${lines.map((l, i) => {
      const w = lineWidth(l);
      return `<div class="ln${i >= 2 ? " scroll" : ""}${w > INIT.metrics.maxWidth ? " over" : ""}"><span>${esc(l)}</span><span class="w">${i >= 2 ? "↑ " : ""}${w}px</span></div>`;
    }).join("")}</div>`).join("");
    st.className = "status" + (bad.length ? " err" : over ? " warn" : "");
    st.textContent = bad.length ? `Characters the game font doesn't have: ${bad.join(" ")}` :
                     over ? `A line is wider than ${INIT.metrics.maxWidth}px and will run off the box.` : "";
    btn.disabled = !changed || bad.length > 0;
    fit();
  };
  ta.addEventListener("input", update);
  card.save = async () => {
    if (btn.disabled) return;
    const strings = encode(layout(ta.value, autoWrap));
    btn.disabled = true;
    const r = await api("/api/text", {map: MAP.name, label: t.label, expected: original, strings});
    if (r.ok) {
      original = strings; t.strings = strings; dirty.delete(card);
      ta.value = loaded = decodeStrings(strings); update();
      st.className = "status ok"; st.textContent = "Saved ✓";
      refreshObjects();
    } else { st.className = "status err"; st.textContent = r.data.error; btn.disabled = false; }
  };
  btn.onclick = card.save;
  requestAnimationFrame(update);
  return card;
}

// ------------------------------------------------------------ script editing

function scriptCard(block, reload) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<textarea class="script" spellcheck="false" wrap="off"></textarea>
    <div class="row"><button class="primary save" disabled>Save script</button><span class="status"></span></div>`;
  const ta = card.querySelector("textarea"), btn = card.querySelector(".save"), st = card.querySelector(".status");
  let original = block.body;
  ta.value = original;
  ta.rows = Math.min(24, original.split("\n").length + 1);
  // Tab indents (scripts.inc uses tabs) instead of moving focus.
  ta.addEventListener("keydown", e => {
    if (e.key !== "Tab" || e.shiftKey) return;
    e.preventDefault();
    ta.setRangeText("\t", ta.selectionStart, ta.selectionEnd, "end");
    ta.dispatchEvent(new Event("input"));
  });
  ta.addEventListener("input", () => {
    const changed = ta.value.replace(/\s+$/, "") !== original;
    changed ? dirty.add(card) : dirty.delete(card);
    const labelOk = ta.value.split("\n")[0].trim() === original.split("\n")[0].trim();
    btn.disabled = !changed || !labelOk;
    st.className = "status" + (labelOk ? "" : " err");
    st.textContent = labelOk ? "" : `Keep the first line as ${original.split("\n")[0].trim()}`;
  });
  card.save = async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    const body = ta.value.replace(/\s+$/, "");
    const r = await api("/api/script", {map: MAP.name, label: block.label, expected: original, body});
    if (r.ok) {
      original = body; dirty.delete(card);
      st.className = "status ok"; st.textContent = "Saved ✓ Run make to check it.";
      await refreshObjects();
      if (!dirty.size) setTimeout(reload, 600);  // new msgbox/text references show up as text cards
    } else { st.className = "status err"; st.textContent = r.data.error; btn.disabled = false; }
  };
  btn.onclick = card.save;
  return card;
}

// ------------------------------------------------------------ movement

let RANGE = null; // {x, y, rx, ry, axes, sight, facings} of the selected trainer/NPC
const movementLabel = c => c.replace(/^MOVEMENT_TYPE_/, "").toLowerCase().split("_").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
const ALL_DIRS = ["up", "down", "left", "right"];

// Which axes a movement type walks along, and which ways it can face (for trainer sight).
function movementInfo(type) {
  const t = type.replace(/^MOVEMENT_TYPE_/, "");
  const dirs = ALL_DIRS.filter(d => new RegExp(`(^|_)${d.toUpperCase()}(_|$)`).test(t));
  let axes = "";
  if (/^(WANDER_AROUND|WALK_SEQUENCE_|COPY_PLAYER|CHASE_PLAYER|FLEE_PLAYER|APPROACH_PLAYER)/.test(t)) axes = "xy";
  else if (/^(WANDER|WALK)_(LEFT_AND_RIGHT|RIGHT_AND_LEFT)$/.test(t)) axes = "x";
  else if (/^(WANDER|WALK)_(UP_AND_DOWN|DOWN_AND_UP)$/.test(t)) axes = "y";
  let facings = dirs;
  if (!facings.length) facings = /^(LOOK_AROUND|ROTATE_|WANDER_AROUND|COPY_PLAYER)/.test(t) ? ALL_DIRS
    : [{south: "down", north: "up", west: "left", east: "right"}[INIT.facing[type] || "south"]];
  return {axes, facings};
}

// Engine rules: range 0 = no limit on that axis; sight is a straight line cut off by collision.
function drawRange() {
  $("#rangeLayer")?.remove();
  if (!RANGE || !MAP) return;
  const {x, y, rx, ry, axes, sight, facings} = RANGE, W = MAP.width, H = MAP.height;
  const cv = Object.assign(document.createElement("canvas"), {id: "rangeLayer", width: W * 16, height: H * 16});
  Object.assign(cv.style, {width: W * 16 * zoom + "px", height: H * 16 * zoom + "px"});
  const g = cv.getContext("2d");
  const blocked = (tx, ty) => tx < 0 || ty < 0 || tx >= W || ty >= H || MAP.collision[ty * W + tx];
  if (axes) {
    const spanX = axes.includes("x"), spanY = axes.includes("y");
    const x0 = !spanX ? x : rx ? Math.max(0, x - rx) : 0, x1 = !spanX ? x : rx ? Math.min(W - 1, x + rx) : W - 1;
    const y0 = !spanY ? y : ry ? Math.max(0, y - ry) : 0, y1 = !spanY ? y : ry ? Math.min(H - 1, y + ry) : H - 1;
    for (let ty = y0; ty <= y1; ty++)
      for (let tx = x0; tx <= x1; tx++) {
        g.fillStyle = blocked(tx, ty) ? "rgba(217,68,58,0.45)" : "rgba(47,111,223,0.28)";
        g.fillRect(tx * 16, ty * 16, 16, 16);
      }
    g.strokeStyle = "rgba(20,60,160,0.9)";
    g.setLineDash([3, 2]);
    g.strokeRect(x0 * 16 + 0.5, y0 * 16 + 0.5, (x1 - x0 + 1) * 16 - 1, (y1 - y0 + 1) * 16 - 1);
  }
  if (sight) {
    const step = {up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]};
    g.setLineDash([]);
    for (const d of facings) {
      const [dx, dy] = step[d];
      for (let i = 1; i <= sight; i++) {
        const tx = x + dx * i, ty = y + dy * i;
        if (blocked(tx, ty)) break;
        g.fillStyle = "rgba(245,180,20,0.42)";
        g.fillRect(tx * 16, ty * 16, 16, 16);
        g.strokeStyle = "rgba(180,110,0,0.8)";
        g.strokeRect(tx * 16 + 4.5, ty * 16 + 4.5, 7, 7);
      }
    }
  }
  $("#mapImg").after(cv);
}

function movementCard(o, ev) {
  const card = document.createElement("div");
  card.className = "card";
  const max = INIT.maxRange, isTrainer = o.kind === "trainer";
  const seesAll = ev.trainer_type && ev.trainer_type !== "TRAINER_TYPE_NORMAL";
  const types = INIT.movementTypes.includes(ev.movement_type) ? INIT.movementTypes : [ev.movement_type, ...INIT.movementTypes];
  card.innerHTML = `<h3><span>Movement${isTrainer ? " & sight" : ""}</span><small>map.json</small></h3>
    <div class="tgrid">
      <label style="grid-column:1/-1">Movement type<select class="mvType">${types.map(t =>
        `<option value="${esc(t)}"${t === ev.movement_type ? " selected" : ""}>${esc(movementLabel(t))}</option>`).join("")}</select></label>
      <label>Range X (left ↔ right)<input type="number" class="mvX" min="0" max="${max}"></label>
      <label>Range Y (up ↕ down)<input type="number" class="mvY" min="0" max="${max}"></label>
      ${isTrainer ? `<label>Sight distance (tiles)<input type="number" class="mvSight" min="0" max="${INIT.maxSight}"></label>
        <div class="sightNote sub"></div>` : ""}
    </div>
    <div class="sub mvNote" style="margin:6px 0 0"></div>
    <div class="row"><button class="primary save" disabled>Save</button><span class="status"></span></div>`;
  const sel = card.querySelector(".mvType"), ix = card.querySelector(".mvX"), iy = card.querySelector(".mvY");
  const isight = card.querySelector(".mvSight");
  const btn = card.querySelector(".save"), st = card.querySelector(".status");
  const sightOf = v => clampInt(v, 0, INIT.maxSight, 0);
  let saved = {type: ev.movement_type, rx: +ev.movement_range_x || 0, ry: +ev.movement_range_y || 0, sight: sightOf(ev.trainer_sight_or_berry_tree_id)};
  let expected = [ev.movement_type, ev.movement_range_x, ev.movement_range_y, ev.trainer_sight_or_berry_tree_id];
  ix.value = saved.rx; iy.value = saved.ry;
  if (isight) isight.value = saved.sight;
  const cur = () => ({type: sel.value, rx: clampInt(ix.value, 0, max, 0), ry: clampInt(iy.value, 0, max, 0),
                      sight: isight ? sightOf(isight.value) : saved.sight});
  const update = () => {
    const c = cur(), info = movementInfo(c.type);
    const facings = seesAll ? ALL_DIRS : info.facings;
    RANGE = {x: o.x, y: o.y, rx: c.rx, ry: c.ry, axes: info.axes, sight: isTrainer ? c.sight : 0, facings};
    ix.disabled = !info.axes.includes("x");
    iy.disabled = !info.axes.includes("y");
    const legend = `<span class="legendSw pass"></span> walkable, <span class="legendSw block"></span> blocked by collision`;
    card.querySelector(".mvNote").innerHTML = !info.axes
      ? "This movement type doesn't walk, so the range has no effect."
      : `Walking area on the map: ${legend}. <b>0 = no limit</b> on that axis (max ${max}).`;
    if (isTrainer) card.querySelector(".sightNote").innerHTML = `<span class="legendSw sight"></span> Sees ${
      seesAll ? "in all directions" : facings.join(", ")} from its start tile; walls cut the line short.`;
    const live = MAP.objects.find(x => x.src === o.src && x.index === o.index);
    if (live?.sprite) live.previewDir = INIT.facing[c.type] || "south";
    drawMarkers();
    const changed = c.type !== saved.type || c.rx !== saved.rx || c.ry !== saved.ry || c.sight !== saved.sight;
    changed ? dirty.add(card) : dirty.delete(card);
    btn.disabled = !changed;
    if (changed) st.textContent = "";
  };
  sel.addEventListener("change", update);
  for (const inp of [ix, iy, isight].filter(Boolean)) {
    inp.addEventListener("input", update);
    inp.addEventListener("blur", () => { const c = cur(); ix.value = c.rx; iy.value = c.ry; if (isight) isight.value = c.sight; });
  }
  card.save = async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    const c = cur();
    const body = {map: MAP.name, index: o.index, expected, type: c.type, rx: c.rx, ry: c.ry};
    if (isTrainer) body.sight = c.sight;
    const r = await api("/api/movement", body);
    if (r.ok) {
      saved = c; expected = [c.type, c.rx, c.ry, isTrainer ? String(c.sight) : ev.trainer_sight_or_berry_tree_id];
      dirty.delete(card);
      st.className = "status ok";
      st.textContent = "Saved ✓ If this map is open in Porymap, reload it there before saving.";
      await refreshObjects();
    } else { st.className = "status err"; st.textContent = r.data.error; btn.disabled = false; }
  };
  btn.onclick = card.save;
  requestAnimationFrame(update);
  return card;
}

let TD = null;
async function trainerData() {
  if (!TD) {
    await loadTrainerData();
    for (const [id, rows] of [["speciesList", TD.species], ["itemOptions", TD.items], ["moveOptions", TD.moves], ["natureOptions", TD.natures]]) {
      if (document.getElementById(id)) continue;
      const dl = Object.assign(document.createElement("datalist"), {id});
      dl.innerHTML = rows.map(x => `<option value="${esc(x.label)}">`).join("");
      document.body.appendChild(dl);
    }
  }
  return TD;
}
let tdPromise = null;
function loadTrainerData() {
  return tdPromise ||= (async () => {
    TD = (await api("/api/trainerdata")).data;
    TD.speciesByConst = Object.fromEntries(TD.species.map(sp => [sp.const, sp]));
    TD.speciesByLabel = new Map(TD.species.map(sp => [sp.label.toLowerCase(), sp]));
    TD.classByConst = Object.fromEntries(TD.classes.map(c => [c.const, c]));
    for (const k of ["items", "moves", "natures"]) {
      TD[k + "ByConst"] = Object.fromEntries(TD[k].map(x => [x.const, x]));
      TD[k + "ByLabel"] = new Map(TD[k].map(x => [x.label.toLowerCase(), x]));
    }
  })();
}

const STATS = ["HP", "Atk", "Def", "SpA", "SpD", "Spe"];
// Mirrors trainerproc: uppercase, non-alnum -> "_", apostrophes dropped.
const partyToken = str => [...str].map(c => /[A-Za-z0-9]/.test(c) ? c.toUpperCase() : c === "'" ? "" : "_").join("");

function parseMon(block) {
  const lines = block.split("\n");
  let [left, ...itemParts] = lines[0].trim().split(/\s+@\s+/);
  const mon = {nick: "", gender: "", item: ref("ITEM_", itemParts.join(" @ ")), level: 100, ivs: [31, 31, 31, 31, 31, 31],
               evs: [0, 0, 0, 0, 0, 0], nature: ref("NATURE_", ""), moves: [], shiny: false, extra: []};
  const g = left.match(/^(.*?)\s+\((M|F)\)$/);
  if (g) { left = g[1]; mon.gender = g[2]; }
  const n = left.match(/^(.*\S)\s+\(([^()]+)\)$/);
  if (n) { mon.nick = n[1]; left = n[2]; }
  mon.speciesRaw = left;
  mon.species = "SPECIES_" + partyToken(left);
  for (const l of lines.slice(1)) {
    const t = l.trim();
    let m;
    if ((m = t.match(/^Level:\s*(\d+)/))) mon.level = +m[1];
    else if ((m = t.match(/^IVs:\s*(.*)$/))) parseStats(m[1], mon.ivs);
    else if ((m = t.match(/^EVs:\s*(.*)$/))) parseStats(m[1], mon.evs);
    else if ((m = t.match(/^Nature:\s*(.+)$/) || t.match(/^(\S+)\s+Nature$/))) mon.nature = ref("NATURE_", m[1].trim());
    else if ((m = t.match(/^-\s*(.+)$/))) mon.moves.push(ref("MOVE_", m[1].trim()));
    else if ((m = t.match(/^Shiny:\s*(\w+)/i))) mon.shiny = /^yes$/i.test(m[1]);
    else if (t) mon.extra.push(l);
  }
  while (mon.moves.length < 4) mon.moves.push(ref("MOVE_", ""));
  return mon;
}
// {raw, const}: const is "" when blank; unknown names keep their raw text so nothing is lost.
function ref(prefix, raw) { return {raw, const: raw ? prefix + partyToken(raw) : ""}; }
function parseStats(text, into) {
  for (const part of text.split("/")) {
    const pm = part.trim().match(/^(\d+)\s+(\w+)$/);
    const i = pm ? STATS.indexOf(pm[2]) : -1;
    if (i >= 0) into[i] = +pm[1];
  }
}

function parseParty(text) {
  const blocks = text.replace(/\r/g, "").trim().split(/\n[ \t]*\n+/);
  const header = blocks[0].split("\n").map(l => {
    const m = l.match(/^([^:]+):\s*(.*)$/);
    return m ? {key: m[1].trim(), value: m[2].trim()} : {raw: l};
  });
  return {header, mons: blocks.slice(1).filter(b => b.trim()).map(parseMon)};
}

const refName = (r, table) => r.const ? (TD[table + "ByConst"][r.const]?.party || r.raw) : "";
const statLine = vals => vals.map((v, i) => `${v} ${STATS[i]}`).join(" / ");
// Order matters to trainerproc: attributes first, moves last.
function serializeMon(mon) {
  const sp = TD.speciesByConst[mon.species]?.party || mon.speciesRaw;
  const item = refName(mon.item, "items"), nature = refName(mon.nature, "natures");
  const first = (mon.nick ? `${mon.nick} (${sp})` : sp) + (mon.gender ? ` (${mon.gender})` : "") + (item ? ` @ ${item}` : "");
  const lines = [first, `Level: ${mon.level}`, "IVs: " + statLine(mon.ivs)];
  if (mon.evs.some(v => v > 0)) lines.push("EVs: " + statLine(mon.evs));
  if (nature) lines.push(`Nature: ${nature}`);
  if (mon.shiny) lines.push("Shiny: Yes");
  lines.push(...mon.extra);
  // No moves listed = the game's level-up moveset.
  for (const mv of mon.moves) if (mv.const) lines.push(`- ${refName(mv, "moves")}`);
  return lines.join("\n");
}
function serializeParty(p) {
  const head = p.header.map(h => h.raw ?? `${h.key}: ${h.value}`).join("\n");
  return [head, ...p.mons.map(serializeMon)].join("\n\n");
}
const hdr = (p, key) => p.header.find(h => h.key === key)?.value;
function setHdr(p, key, value) {
  const h = p.header.find(x => x.key === key);
  h ? (h.value = value) : p.header.push({key, value});
}
const clampInt = (v, lo, hi, dflt) => { const n = parseInt(v, 10); return isNaN(n) ? dflt : Math.min(hi, Math.max(lo, n)); };
const options = (list, selected) => list.map(o => `<option value="${esc(o.value)}"${o.value === selected ? " selected" : ""}>${esc(o.label)}</option>`).join("");

let ITEM_ICONS = null;

function itemCard(o, it) {

  const resolve = v => {
    const hit = TD?.itemsByLabel.get(v.trim().toLowerCase());

    const c = resolve(inp.value), changed = c !== it.item;

    showIcon(c || it.item);

  });
  card.save = async () => {
    if (btn.disabled) return;

    const item = resolve(inp.value);
    const r = await api("/api/item", {map: MAP.name, kind: it.kind, index: o.index, item});

      await refreshObjects();
      const d = await api(`/api/object?map=${encodeURIComponent(MAP.name)}&src=${o.src}&index=${o.index}`);
      if (d.ok) { it.item = d.data.item.item; it.flag = d.data.item.flag; card.querySelector(".flag").textContent = it.flag; }
    } else { st.className = "status err"; st.textContent = r.data.error; btn.disabled = false; }
  };
  btn.onclick = card.save;
  return card;
}

// ------------------------------------------------------------ wiring

function nextTodo() {
  if (!MAP) return;
  const todos = MAP.objects.filter(o => o.placeholder && isShown(o));
  if (!todos.length) { alert("Everything on this map is filled in."); return; }
  const i = SEL ? todos.findIndex(o => isSel(o)) : -1;
  const o = todos[(i + 1) % todos.length];
  select(o);
  const m = document.querySelector(`.marker[data-key="${o.src}:${o.index}"]`);
  m?.scrollIntoView({block: "center", inline: "center", behavior: "smooth"});
}

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") {
    e.preventDefault();
    const card = document.activeElement?.closest(".card");
    if (card?.save) card.save();
  }
});
window.addEventListener("beforeunload", e => { if (dirty.size) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("hashchange", () => { const n = decodeURIComponent(location.hash.slice(1)); if (n && n !== MAP?.name) loadMap(n); });

(async () => {
  const r = await api("/api/init");
  INIT = r.data;
  $("#mapList").innerHTML = INIT.maps.map(m => `<option value="${m}">`).join("");
  const resolveMap = v => INIT.maps.find(m => m.toLowerCase() === v.trim().toLowerCase());
  $("#mapInput").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const n = resolveMap(e.target.value);
    n ? loadMap(n) : alert(`No map named "${e.target.value}"`);
  });
  $("#mapInput").addEventListener("change", e => {
    const n = resolveMap(e.target.value);
    if (n && n !== MAP?.name && n !== loadingMap) loadMap(n);
  });
  $("#reloadBtn").onclick = () => MAP && loadMap(MAP.name, false);
  $("#zoomOut").onclick = () => setZoom(zoom - 1);
  $("#zoomIn").onclick = () => setZoom(zoom + 1);
  $("#nextTodo").onclick = nextTodo;
  document.querySelectorAll("#legend input[data-cat]").forEach(cb => {
    cb.checked = !hiddenCats.has(cb.dataset.cat);
    cb.onchange = () => {
      cb.checked ? hiddenCats.delete(cb.dataset.cat) : hiddenCats.add(cb.dataset.cat);
      try { localStorage.setItem("hiddenCats", JSON.stringify([...hiddenCats])); localStorage.removeItem("showTriggers"); } catch (err) {}
      if (MAP) drawMarkers();
    };
  });
  const start = decodeURIComponent(location.hash.slice(1)) || INIT.defaultMap;
  if (start && INIT.maps.includes(start)) loadMap(start);
})();
</script>
</body>
